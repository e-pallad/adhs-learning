# Netcup vServer deployment
# Build and run the app directly on the server.
# Nginx handles TLS termination; the app is NOT exposed to the internet directly.
#
# Usage:
#   docker compose -f compose.netcup.yml build
#   docker compose -f compose.netcup.yml up -d

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: devfluent:latest
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.production
    restart: unless-stopped
