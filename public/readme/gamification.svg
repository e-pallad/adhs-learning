<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1030"/>
    </linearGradient>
    <linearGradient id="xpbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" fill="url(#bg3)" rx="12"/>

  <!-- Section title -->
  <text x="450" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#818cf8">GAMIFICATION SYSTEM</text>

  <!-- Level card -->
  <g transform="translate(24, 48)">
    <rect width="196" height="120" rx="10" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
    <text x="98" y="32" text-anchor="middle" font-family="system-ui" font-size="12" fill="#94a3b8">Current Level</text>
    <text x="98" y="64" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="800" fill="#e0e7ff">Lv. 7</text>
    <text x="98" y="84" text-anchor="middle" font-family="system-ui" font-size="12" fill="#a5b4fc">Expert Dev</text>
    <!-- XP bar -->
    <rect x="16" y="96" width="164" height="6" rx="3" fill="#312e81"/>
    <rect x="16" y="96" width="118" height="6" rx="3" fill="url(#xpbar)"/>
    <text x="16" y="116" font-family="system-ui" font-size="10" fill="#64748b">3,240 XP</text>
    <text x="180" y="116" text-anchor="end" font-family="system-ui" font-size="10" fill="#64748b">4,000 XP</text>
  </g>

  <!-- Streak card -->
  <g transform="translate(240, 48)">
    <rect width="140" height="120" rx="10" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
    <text x="70" y="32" text-anchor="middle" font-family="system-ui" font-size="12" fill="#94a3b8">Streak</text>
    <text x="70" y="76" text-anchor="middle" font-size="48">🔥</text>
    <text x="70" y="104" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#fbbf24">14 days</text>
  </g>

  <!-- Quiz card -->
  <g transform="translate(400, 48)">
    <rect width="150" height="120" rx="10" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
    <text x="75" y="32" text-anchor="middle" font-family="system-ui" font-size="12" fill="#94a3b8">Quiz XP</text>
    <g transform="translate(16, 44)">
      <rect width="118" height="18" rx="4" fill="#312e81"/>
      <rect width="60" height="18" rx="4" fill="#4f46e5"/>
      <text x="59" y="13" text-anchor="middle" font-family="system-ui" font-size="10" fill="#c7d2fe">Attempt +5</text>
    </g>
    <g transform="translate(16, 68)">
      <rect width="118" height="18" rx="4" fill="#312e81"/>
      <rect width="85" height="18" rx="4" fill="#7c3aed"/>
      <text x="59" y="13" text-anchor="middle" font-family="system-ui" font-size="10" fill="#ddd6fe">Pass ≥70% +15</text>
    </g>
    <g transform="translate(16, 92)">
      <rect width="118" height="18" rx="4" fill="#312e81"/>
      <rect width="118" height="18" rx="4" fill="#a855f7"/>
      <text x="59" y="13" text-anchor="middle" font-family="system-ui" font-size="10" fill="#f5f3ff">Perfect 100% +30</text>
    </g>
  </g>

  <!-- Achievements card -->
  <g transform="translate(570, 48)">
    <rect width="150" height="120" rx="10" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
    <text x="75" y="32" text-anchor="middle" font-family="system-ui" font-size="12" fill="#94a3b8">Achievements</text>
    <text x="20" y="62" font-size="20">🏆</text>
    <text x="20" y="88" font-size="20">⚡</text>
    <text x="20" y="114" font-size="20">🎯</text>
    <text x="48" y="62" font-family="system-ui" font-size="11" fill="#e0e7ff">First Block</text>
    <text x="48" y="75" font-family="system-ui" font-size="10" fill="#64748b">Complete your first block</text>
    <text x="48" y="88" font-family="system-ui" font-size="11" fill="#e0e7ff">Speed Runner</text>
    <text x="48" y="101" font-family="system-ui" font-size="10" fill="#64748b">5 blocks in one day</text>
    <text x="48" y="114" font-family="system-ui" font-size="11" fill="#e0e7ff">Consistent</text>
    <text x="48" y="127" font-family="system-ui" font-size="10" fill="#64748b">7-day streak</text>
  </g>

  <!-- Levels card -->
  <g transform="translate(740, 48)">
    <rect width="136" height="120" rx="10" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
    <text x="68" y="32" text-anchor="middle" font-family="system-ui" font-size="12" fill="#94a3b8">10 Levels</text>
    <text x="16" y="56" font-family="system-ui" font-size="11" fill="#64748b">1 · Newcomer</text>
    <text x="16" y="72" font-family="system-ui" font-size="11" fill="#6366f1">4 · Intermediate</text>
    <text x="16" y="88" font-family="system-ui" font-size="11" fill="#8b5cf6">7 · Expert Dev</text>
    <text x="16" y="104" font-family="system-ui" font-size="11" fill="#a855f7">9 · Senior Dev</text>
    <text x="16" y="120" font-family="system-ui" font-size="11" fill="#c084fc">10 · Fluent Dev ✨</text>
  </g>
</svg>
