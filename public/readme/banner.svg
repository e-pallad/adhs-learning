<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Left glow blob -->
  <ellipse cx="160" cy="150" rx="200" ry="120" fill="#6366f1" opacity="0.08"/>

  <!-- Right glow blob -->
  <ellipse cx="1050" cy="150" rx="180" ry="100" fill="#8b5cf6" opacity="0.07"/>

  <!-- Accent bar -->
  <rect x="80" y="100" width="5" height="100" fill="url(#accent)" rx="3"/>

  <!-- App name -->
  <text x="108" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" filter="url(#glow)">Devfluent</text>

  <!-- Tagline -->
  <text x="108" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#a5b4fc">ADHD-friendly developer learning tracker</text>

  <!-- Feature pills -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
    <!-- XP pill -->
    <rect x="108" y="220" width="72" height="26" rx="13" fill="#6366f1" opacity="0.3"/>
    <rect x="108" y="220" width="72" height="26" rx="13" fill="none" stroke="#6366f1" stroke-width="1"/>
    <text x="144" y="237" text-anchor="middle" fill="#c7d2fe">XP &amp; Levels</text>

    <!-- Streaks pill -->
    <rect x="192" y="220" width="68" height="26" rx="13" fill="#7c3aed" opacity="0.3"/>
    <rect x="192" y="220" width="68" height="26" rx="13" fill="none" stroke="#7c3aed" stroke-width="1"/>
    <text x="226" y="237" text-anchor="middle" fill="#ddd6fe">Streaks</text>

    <!-- AI pill -->
    <rect x="272" y="220" width="58" height="26" rx="13" fill="#4f46e5" opacity="0.3"/>
    <rect x="272" y="220" width="58" height="26" rx="13" fill="none" stroke="#4f46e5" stroke-width="1"/>
    <text x="301" y="237" text-anchor="middle" fill="#c7d2fe">AI Tips</text>

    <!-- Pomodoro pill -->
    <rect x="342" y="220" width="84" height="26" rx="13" fill="#6d28d9" opacity="0.3"/>
    <rect x="342" y="220" width="84" height="26" rx="13" fill="none" stroke="#6d28d9" stroke-width="1"/>
    <text x="384" y="237" text-anchor="middle" fill="#ddd6fe">Pomodoro</text>

    <!-- PWA pill -->
    <rect x="438" y="220" width="52" height="26" rx="13" fill="#4338ca" opacity="0.3"/>
    <rect x="438" y="220" width="52" height="26" rx="13" fill="none" stroke="#4338ca" stroke-width="1"/>
    <text x="464" y="237" text-anchor="middle" fill="#c7d2fe">PWA</text>
  </g>

  <!-- Right side: stats card mockup -->
  <g transform="translate(740, 48)">
    <rect width="380" height="204" rx="12" fill="#1e1b4b" opacity="0.8" stroke="#3730a3" stroke-width="1"/>

    <!-- Card header -->
    <rect width="380" height="44" rx="12" fill="#312e81" opacity="0.6"/>
    <rect x="0" y="32" width="380" height="12" fill="#312e81" opacity="0.6"/>
    <text x="16" y="28" font-family="system-ui" font-size="13" font-weight="600" fill="#c7d2fe">Dashboard</text>
    <text x="300" y="28" font-family="system-ui" font-size="12" fill="#818cf8">Level 7 · Expert</text>

    <!-- XP bar -->
    <text x="16" y="68" font-family="system-ui" font-size="11" fill="#94a3b8">Total XP</text>
    <text x="310" y="68" font-family="system-ui" font-size="11" fill="#818cf8">3,240 / 4,000</text>
    <rect x="16" y="74" width="348" height="8" rx="4" fill="#1e1b4b"/>
    <rect x="16" y="74" width="280" height="8" rx="4" fill="url(#accent)"/>

    <!-- Stats row -->
    <rect x="16" y="100" width="100" height="54" rx="8" fill="#312e81" opacity="0.5"/>
    <text x="66" y="122" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="700" fill="#f0f9ff">🔥 14</text>
    <text x="66" y="140" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94a3b8">day streak</text>

    <rect x="128" y="100" width="100" height="54" rx="8" fill="#312e81" opacity="0.5"/>
    <text x="178" y="122" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="700" fill="#f0f9ff">⚡ 48</text>
    <text x="178" y="140" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94a3b8">blocks done</text>

    <rect x="240" y="100" width="124" height="54" rx="8" fill="#312e81" opacity="0.5"/>
    <text x="302" y="122" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="700" fill="#f0f9ff">🏆 12</text>
    <text x="302" y="140" text-anchor="middle" font-family="system-ui" font-size="10" fill="#94a3b8">achievements</text>

    <!-- Activity dots -->
    <text x="16" y="174" font-family="system-ui" font-size="10" fill="#64748b">Activity</text>
    <g fill="#4338ca">
      <rect x="16" y="180" width="10" height="10" rx="2" opacity="0.3"/>
      <rect x="30" y="180" width="10" height="10" rx="2" opacity="0.8"/>
      <rect x="44" y="180" width="10" height="10" rx="2" opacity="1"/>
      <rect x="58" y="180" width="10" height="10" rx="2" opacity="0.5"/>
      <rect x="72" y="180" width="10" height="10" rx="2" opacity="1"/>
      <rect x="86" y="180" width="10" height="10" rx="2" opacity="0.9"/>
      <rect x="100" y="180" width="10" height="10" rx="2" opacity="0.4"/>
      <rect x="114" y="180" width="10" height="10" rx="2" opacity="1"/>
      <rect x="128" y="180" width="10" height="10" rx="2" opacity="0.7"/>
      <rect x="142" y="180" width="10" height="10" rx="2" opacity="1"/>
      <rect x="156" y="180" width="10" height="10" rx="2" opacity="0.6"/>
      <rect x="170" y="180" width="10" height="10" rx="2" opacity="0.2"/>
      <rect x="184" y="180" width="10" height="10" rx="2" opacity="1"/>
      <rect x="198" y="180" width="10" height="10" rx="2" opacity="0.85"/>
    </g>
  </g>
</svg>
