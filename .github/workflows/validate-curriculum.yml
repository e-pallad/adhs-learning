name: Validate Curriculum

on:
  pull_request:
    paths:
      - "content/curriculum/tracks/**"

jobs:
  validate:
    name: JSON Schema Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run curriculum validator
        run: node scripts/validate-curriculum.js
