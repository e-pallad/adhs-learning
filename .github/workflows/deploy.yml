name: Deploy to netcup

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

# Only one deployment at a time; cancel any queued run if a newer push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Only run when CI workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Deploy via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "$DEPLOY_KEY" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -y -f /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@188.68.57.27" '
            set -euo pipefail
            cd /opt/devfluent
            echo "==> Pulling latest code..."
            git pull --ff-only origin master
            echo "==> Building new image..."
            docker compose -f compose.netcup.yml --env-file .env.production build
            echo "==> Restarting services..."
            docker compose -f compose.netcup.yml up -d --remove-orphans
            echo "==> Pruning old images..."
            docker image prune -f
            echo "==> Deploy complete."
          '
