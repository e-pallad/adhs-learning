name: Deploy to netcup

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

# Only one deployment at a time; cancel any queued run if a newer push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Only run when CI workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 185.243.11.25
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ~/.ssh/deploy_key
          debug: true
          script: |
            set -euo pipefail
            cd /opt/devfluent

            echo "==> Pulling latest code..."
            git pull --ff-only origin master

            echo "==> Building new image..."
            docker compose -f compose.netcup.yml --env-file .env.production build

            echo "==> Restarting services with zero-downtime swap..."
            docker compose -f compose.netcup.yml up -d --remove-orphans

            echo "==> Pruning old images..."
            docker image prune -f

            echo "==> Deploy complete."
