name: Deploy to netcup

on:
  push:
    branches: [master]

# Only one deployment at a time; cancel any queued run if a newer push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Only run after CI passes (test, lint, typecheck must all be green)
    needs: []   # ci.yml runs in parallel; we gate via environment protection rules
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 185.243.11.25
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/devfluent

            echo "==> Pulling latest code..."
            git pull --ff-only origin master

            echo "==> Building new image..."
            docker compose -f compose.netcup.yml --env-file .env.production build

            echo "==> Restarting services with zero-downtime swap..."
            docker compose -f compose.netcup.yml up -d --remove-orphans

            echo "==> Pruning old images..."
            docker image prune -f

            echo "==> Deploy complete."
