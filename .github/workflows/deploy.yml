name: Deploy to netcup

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

# Only one deployment at a time; cancel any queued run if a newer push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Only run when CI workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Decode SSH key
        id: ssh-key
        run: |
          KEY=$(echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d)
          echo "key<<SSHKEYEOF" >> $GITHUB_OUTPUT
          echo "$KEY" >> $GITHUB_OUTPUT
          echo "SSHKEYEOF" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 185.243.11.25
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ steps.ssh-key.outputs.key }}
          script: |
            set -euo pipefail
            cd /opt/devfluent
            git pull --ff-only origin master
            docker compose -f compose.netcup.yml --env-file .env.production build
            docker compose -f compose.netcup.yml up -d --remove-orphans
            docker image prune -f
            echo "==> Deploy complete."
