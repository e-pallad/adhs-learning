name: Deploy to netcup

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

# Only one deployment at a time; cancel any queued run if a newer push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Only run when CI workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Show runner IP
        run: curl -s https://api.ipify.org && echo

      - name: Write SSH key
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > /home/runner/.ssh/deploy_key
          chmod 600 /home/runner/.ssh/deploy_key
          echo "=== Public key from decoded secret ==="
          ssh-keygen -y -f /home/runner/.ssh/deploy_key

      - name: Test SSH connection (verbose)
        run: |
          ssh -vvv -i /home/runner/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@185.243.11.25 "echo SSH_OK" 2>&1 || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 185.243.11.25
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /home/runner/.ssh/deploy_key
          script: |
            set -euo pipefail
            cd /opt/devfluent
            git pull --ff-only origin master
            docker compose -f compose.netcup.yml --env-file .env.production build
            docker compose -f compose.netcup.yml up -d --remove-orphans
            docker image prune -f
            echo "==> Deploy complete."
